name: Daily Tea Digest

# Автозапуск по расписанию отключён: скрипта рассылки дайджеста пока нет,
# а запуск `python bot.py` на CI поднимал webhook-сервер, который висел впустую
# и перехватывал webhook продакшн-бота. Расписание вернём, когда появится
# отдельный скрипт рассылки (см. ARCHITECTURE.md, «Известные проблемы»).
on:
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUR_TELEGRAM_ID: ${{ secrets.YOUR_TELEGRAM_ID }}
          FIREWORKS_KEY: ${{ secrets.FIREWORKS_KEY }}
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
        run: python bot.py
