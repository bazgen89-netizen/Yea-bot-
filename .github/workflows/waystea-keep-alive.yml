name: WAYSTEA ONE keep-alive

# Render's free Web Service tier spins down after ~15 minutes with no HTTP
# traffic, causing a 30-60s cold-start delay on the next request/button
# click. This just pings the bot's health endpoint (app/health.py)
# regularly so it never fully falls asleep. Crash recovery itself is
# already handled by Render (it auto-restarts a crashed process) — this
# workflow only addresses the inactivity-sleep case.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WAYSTEA ONE bot
        run: curl -fsS --max-time 55 https://waystea-one-bot.onrender.com/ || true
